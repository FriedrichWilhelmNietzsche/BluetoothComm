name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator
    runs-on: macos-14
    timeout-minutes: 40

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Show environment
      run: |
        xcodebuild -version
        dotnet --version 2>/dev/null || echo "dotnet not preinstalled"

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify .NET
      run: dotnet --list-sdks

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore
      run: dotnet restore BluetoothComm.csproj

    - name: Build for iOS Simulator
      run: |
        dotnet build BluetoothComm.csproj \
          -c Debug \
          -f net10.0-ios \
          -p:RuntimeIdentifier=iossimulator-arm64 \
          -p:BuildIpa=false \
          -v minimal

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iOS-Simulator-Build
        path: '**/*.app'
        retention-days: 7

  build-ipa:
    name: Build iOS IPA (Signed)
    runs-on: macos-14
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE != '' }}

    steps:
    - name: Checkout
      if: env.HAS_SIGNING == 'true'
      uses: actions/checkout@v4

    - name: Setup .NET 10
      if: env.HAS_SIGNING == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Workload
      if: env.HAS_SIGNING == 'true'
      run: dotnet workload install maui

    - name: Install Apple Certificate
      if: env.HAS_SIGNING == 'true'
      env:
        IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH=$RUNNER_TEMP/cert.p12
        echo -n "$IOS_CERTIFICATE" | base64 --decode -o $CERT_PATH
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security import $CERT_PATH -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

    - name: Install Provisioning Profile
      if: env.HAS_SIGNING == 'true'
      env:
        IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      run: |
        PP_PATH=$RUNNER_TEMP/profile.mobileprovision
        echo -n "$IOS_PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build Signed IPA
      if: env.HAS_SIGNING == 'true'
      run: |
        dotnet build BluetoothComm.csproj \
          -c Release \
          -f net10.0-ios \
          -p:ArchiveOnBuild=true \
          -p:BuildIpa=true

    - name: Upload IPA
      if: env.HAS_SIGNING == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: iOS-IPA
        path: '**/Release/net10.0-ios/**/*.ipa'
        retention-days: 30
